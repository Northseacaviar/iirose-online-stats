<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>iirose 在线状态监测</title>
<style>
/* ===== 设计令牌:参考调色板(浅/深两套,OS 跟随 + 手动切换) ===== */
:root {
  color-scheme: light;
  --page:            #f9f9f7;
  --surface-1:       #fcfcfb;
  --text-primary:    #0b0b0b;
  --text-secondary:  #52514e;
  --muted:           #898781;
  --gridline:        #e1e0d9;
  --baseline:        #c3c2b7;
  --border:          rgba(11,11,11,.10);
  --series-1:        #2a78d6;  /* Online   蓝 */
  --series-2:        #43b581;  /* Chatting 绿(站点聊天阶梯色) */
  --series-3:        #faa61a;  /* Active   黄(站点活跃阶梯色) */
  --series-4:        #f04747;  /* Away     红(站点挂机色) */
  --series-5:        #2f9e9e;  /* 真人(去 AI) 青 */
  --series-6:        #c0703a;  /* 热度       琥珀 */
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page:            #0d0d0d;
    --surface-1:       #1a1a19;
    --text-primary:    #ffffff;
    --text-secondary:  #c3c2b7;
    --muted:           #898781;
    --gridline:        #2c2c2a;
    --baseline:        #383835;
    --border:          rgba(255,255,255,.10);
    --series-1:        #3987e5;
    --series-2:        #68b26d;  /* Chatting 绿 */
    --series-3:        #f89323;  /* Active   黄 */
    --series-4:        #f04747;  /* Away     红 */
    --series-5:        #4bb5b5;  /* 真人(去 AI) 青 */
    --series-6:        #e0975a;  /* 热度       琥珀 */
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page:            #0d0d0d;
  --surface-1:       #1a1a19;
  --text-primary:    #ffffff;
  --text-secondary:  #c3c2b7;
  --muted:           #898781;
  --gridline:        #2c2c2a;
  --baseline:        #383835;
  --border:          rgba(255,255,255,.10);
  --series-1:        #3987e5;
  --series-2:        #d95926;
  --series-3:        #199e70;
  --series-4:        #c98500;
  --series-5:        #4bb5b5;
  --series-6:        #e0975a;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--page);
  color: var(--text-primary);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  transition: background .2s, color .2s;
}
.viz-root { max-width: 1100px; margin: 0 auto; padding: 24px 20px 48px; }

/* ===== 头部 ===== */
header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
h1 { font-size: 20px; font-weight: 600; }
.sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
#themeBtn {
  font: inherit; font-size: 13px; color: var(--text-secondary);
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 12px; cursor: pointer;
}
#themeBtn:hover { border-color: var(--baseline); }

/* ===== 数值瓦片 ===== */
.tiles { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-bottom: 16px; }
@media (max-width: 720px) { .tiles { grid-template-columns: repeat(2, 1fr); } }
.tile {
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 12px; padding: 12px 16px;
}
.tile .label { font-size: 12px; color: var(--text-secondary); display: flex; align-items: center; gap: 7px; }
.tile .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.tile .value { font-size: 26px; font-weight: 600; margin-top: 6px; }

/* ===== 过滤器 ===== */
.filters { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.filters .grp { display: flex; background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.filters button {
  font: inherit; font-size: 13px; color: var(--text-secondary);
  background: transparent; border: 0; padding: 6px 14px; cursor: pointer;
}
.filters button.active { color: var(--text-primary); font-weight: 600; background: var(--gridline); }
#updatedAt { margin-left: auto; font-size: 12px; color: var(--muted); }
/* .filters 自带 display:flex,会盖掉 hidden 属性的 UA 样式,须显式声明 */
.filters[hidden] { display: none; }
.filters input[type="date"] {
  font: inherit; font-size: 13px; color: var(--text-primary);
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 8px; padding: 5px 8px;
}
.filters input[type="date"]:focus { outline: none; border-color: var(--baseline); }
.filters .to { font-size: 13px; color: var(--muted); }
#applyCustom {
  font: inherit; font-size: 13px; color: var(--text-primary);
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 14px; cursor: pointer;
}
#applyCustom:hover { border-color: var(--baseline); }
#customMsg, .hint { font-size: 12px; color: var(--muted); }
.hint { margin: -6px 0 12px; }

/* ===== 图表 ===== */
.chart-wrap {
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 12px; padding: 12px 8px 4px;
}
#chart { width: 100%; height: clamp(260px, 42vh, 460px); }
#empty {
  display: none; height: clamp(260px, 42vh, 460px); align-items: center; justify-content: center;
  color: var(--muted); font-size: 14px;
}

/* ===== 数据表格 ===== */
.table-wrap { margin-top: 16px; }
.table-wrap h2 { font-size: 14px; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; }
table { width: 100%; border-collapse: collapse; background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
th, td { padding: 8px 12px; text-align: right; font-size: 13px; font-variant-numeric: tabular-nums; }
th { color: var(--text-secondary); font-weight: 500; border-bottom: 1px solid var(--border); }
td { color: var(--text-primary); }
th:first-child, td:first-child { text-align: left; color: var(--muted); }
tbody tr:nth-child(even) { background: color-mix(in srgb, var(--gridline) 35%, transparent); }
</style>
</head>
<body>
<div class="viz-root">
  <header>
    <div>
      <h1>iirose 在线状态监测</h1>
      <div class="sub">全站数据 · 每 600 秒采样 · 点图例可隐藏/显示线条</div>
    </div>
    <button id="themeBtn" title="切换深浅主题">🌙 深色</button>
  </header>

  <div class="tiles">
    <div class="tile"><div class="label"><span class="dot" style="background:var(--series-1)"></span>Online 在线</div><div class="value" id="v-online">—</div></div>
    <div class="tile"><div class="label"><span class="dot" style="background:var(--series-2)"></span>Chatting 聊天中</div><div class="value" id="v-chatting">—</div></div>
    <div class="tile"><div class="label"><span class="dot" style="background:var(--series-3)"></span>Active 活跃</div><div class="value" id="v-active">—</div></div>
    <div class="tile"><div class="label"><span class="dot" style="background:var(--series-4)"></span>Away 挂机</div><div class="value" id="v-away">—</div></div>
    <div class="tile"><div class="label"><span class="dot" style="background:var(--series-5)"></span>真人(去 AI)</div><div class="value" id="v-real">—</div></div>
    <div class="tile"><div class="label"><span class="dot" style="background:var(--series-6)"></span>热度</div><div class="value" id="v-heat">—</div></div>
  </div>

  <div class="filters">
    <span style="font-size:13px;color:var(--muted)">时间范围</span>
    <div class="grp" id="rangeGrp">
      <button data-range="1h">1 小时</button>
      <button data-range="3h">3 小时</button>
      <button data-range="8h">8 小时</button>
      <button data-range="24h" class="active">24 小时</button>
      <button data-range="7d">7 天</button>
      <button data-range="all">全部</button>
      <button data-range="custom">自定义</button>
    </div>
    <span id="updatedAt"></span>
  </div>

  <div class="filters" id="customRow" hidden>
    <span style="font-size:13px;color:var(--muted)">日期</span>
    <input type="date" id="dateStart" aria-label="开始日期">
    <span class="to">至</span>
    <input type="date" id="dateEnd" aria-label="结束日期">
    <button id="applyCustom">应用</button>
    <span id="customMsg"></span>
  </div>
  <div class="hint" id="dataStartHint"></div>

  <div class="chart-wrap">
    <div id="chart"></div>
    <div id="empty">暂无数据 —— 等待采集器连上 iirose 并完成首次采样</div>
  </div>

  <div class="table-wrap">
    <h2>数据明细(范围内最近 100 条)</h2>
    <table>
      <thead><tr>
        <th>时间</th><th>Online</th><th>Chatting</th><th>Active</th><th>Away</th><th>真人</th><th>热度</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<script src="/static/echarts.min.js"></script>
<script>
"use strict";
const SERIES = [
  { key: "online",   label: "Online",   slot: "--series-1" },
  { key: "chatting", label: "Chatting", slot: "--series-2" },
  { key: "active",   label: "Active",   slot: "--series-3" },
  { key: "away",     label: "Away",     slot: "--series-4" },
  { key: "real",     label: "真人",     slot: "--series-5" },
  { key: "heat",     label: "热度",     slot: "--series-6", axis: 1 },
];
let currentRange = "24h";
let customRange = null;     // 已应用的自定义范围 {start, end}(均为 YYYY-MM-DD),未应用为 null
let chart = null;
let lastSamples = [];
let lastDataTs = null;      // 上次轮询拿到的最新采样 ts:未变则不动 DOM/图表
let lastRenderedTs = null;  // 图表当前绘制的最新 ts
let lastWindow = null;      // 上次渲染的固定时间窗口 {minMs, maxMs|null};null = 横轴自适应
const RANGE_SECONDS = { "1h": 3600, "3h": 3 * 3600, "8h": 8 * 3600, "24h": 86400, "7d": 7 * 86400, "all": null };

/* ===== 线条显隐 =====
 * 图例点击能切显隐(echarts 自带),但每次 setOption(notMerge) 都会把 legend.selected
 * 重置回全选 —— 新样本到来、切时间范围、切主题都会把用户隐藏的线全部放回来。
 * 所以隐藏项单独记一份(localStorage),每次渲染都带上,刷新页面也保持。 */
const HIDDEN_KEY = "iirose_stats_hidden_lines";
const hiddenKeys = new Set(loadHiddenKeys());

function loadHiddenKeys() {
  try {
    const raw = JSON.parse(localStorage.getItem(HIDDEN_KEY) || "[]");
    return Array.isArray(raw) ? raw.filter((k) => SERIES.some((s) => s.key === k)) : [];
  } catch (e) {
    return []; // 存储被禁用或内容写坏:退回全显示
  }
}

function saveHiddenKeys() {
  try {
    localStorage.setItem(HIDDEN_KEY, JSON.stringify([...hiddenKeys]));
  } catch (e) { /* 无痕模式等写不进:本次会话内仍生效 */ }
}

function legendSelected() {
  const sel = {};
  for (const s of SERIES) sel[s.label] = !hiddenKeys.has(s.key);
  return sel;
}

/* ?theme=dark|light 便于无头验证/快速切换 */
const themeParam = new URLSearchParams(location.search).get("theme");
if (themeParam === "dark" || themeParam === "light") {
  document.documentElement.dataset.theme = themeParam;
}

const root = document.querySelector(".viz-root");
const cssVar = (name) => getComputedStyle(root).getPropertyValue(name).trim();
const chartColors = () => SERIES.map((s) => cssVar(s.slot));

/* ===== 主题 ===== */
const osDark = window.matchMedia("(prefers-color-scheme: dark)");
function effectiveDark() {
  const t = document.documentElement.dataset.theme;
  if (t === "dark") return true;
  if (t === "light") return false;
  return osDark.matches;
}
function syncThemeBtn() {
  document.getElementById("themeBtn").textContent = effectiveDark() ? "☀️ 浅色" : "🌙 深色";
}
document.getElementById("themeBtn").addEventListener("click", () => {
  document.documentElement.dataset.theme = effectiveDark() ? "light" : "dark";
  syncThemeBtn();
  initChart();
  renderChart(lastSamples, true, lastWindow);
});
osDark.addEventListener("change", () => {
  if (!document.documentElement.dataset.theme) {
    initChart();
    renderChart(lastSamples, true, lastWindow);
  }
});
syncThemeBtn();

/* ===== 图表 ===== */
function baseOption() {
  const ink = cssVar("--text-secondary"), muted = cssVar("--muted"),
        grid = cssVar("--gridline"), axis = cssVar("--baseline");
  return {
    animationDuration: 300,
    color: chartColors(),
    textStyle: { color: ink, fontFamily: "system-ui, -apple-system, 'Segoe UI', sans-serif" },
    tooltip: {
      trigger: "axis",
      axisPointer: { type: "cross", label: { color: cssVar("--text-primary"), backgroundColor: cssVar("--surface-1") } },
      backgroundColor: cssVar("--surface-1"),
      borderColor: cssVar("--baseline"),
      textStyle: { color: cssVar("--text-primary"), fontSize: 12 },
    },
    legend: {
      top: 0, left: 0, icon: "roundRect", itemWidth: 14, itemHeight: 4,
      textStyle: { color: ink, fontSize: 12 },
      selected: legendSelected(), // 每次渲染都带上用户隐藏的线,否则重绘即复原
      // 最新值挂在图例上:六条线共用一个右端标签会互相压住(echarts 不做避让)
      formatter: (name) => {
        const meta = SERIES.find((x) => x.label === name);
        const row = lastSamples[lastSamples.length - 1];
        const v = meta && row ? row[meta.key] : null;
        return v === null || v === undefined ? name : `${name} ${v}`;
      },
    },
    grid: { left: 8, right: 24, top: 36, bottom: 8, containLabel: true },
    xAxis: {
      type: "time",
      axisLine: { lineStyle: { color: axis } },
      axisLabel: { color: muted, fontSize: 11 },
      splitLine: { show: false },
    },
    yAxis: [
      {
        type: "value",
        minInterval: 1,
        axisLine: { show: false },
        axisLabel: { color: muted, fontSize: 11 },
        splitLine: { lineStyle: { color: grid, width: 1 } },
      },
      { // 右轴:热度(量级比人数大一个数量级,共轴会把人数压平);热度线隐藏时轴一并收起
        type: "value",
        show: !hiddenKeys.has("heat"),
        axisLine: { show: false },
        axisLabel: { color: cssVar("--series-6"), fontSize: 11 }, // 与热度线同色,一眼对得上
        splitLine: { show: false },
      },
    ],
  };
}

function seriesOption(samples) {
  return SERIES.map((s) => ({
    name: s.label,
    type: "line",
    yAxisIndex: s.axis || 0,
    data: samples.map((r) => [new Date(r.ts), r[s.key]]),
    showSymbol: false,
    connectNulls: false, // 缺失时段断线显示,不画误导性的跨越连线
    // 点数远多于像素宽度时按 LTTB 抽样(实测 14928 点 → 渲染 1000 点,1042px 画布):
    // 「全部」/跨月区间一年后会到 5 万点,不抽样每 10 秒重绘会越来越重。
    // 缺失时段的断口不受影响(抽样后依然断开,已实测)。
    sampling: "lttb",
    lineStyle: { width: 2 },
    emphasis: { lineStyle: { width: 3 } },
  }));
}

/* 与 browser-js/collector.js 中的 padGaps 同源(那里按数组下标绘制,必须补前导/尾部空点;
 * 本页用 echarts,前导/尾部缺失由固定坐标轴窗口呈现,这里只补样本间的空点,两处逻辑需同步修改)。
 * 按采样间隔重建时间线:相邻样本间隔 > 2 个节拍时,中间补 null 点。
 * 停机/断连期间的缺失在图上显示为明确的断口,而不是一条横跨缺口的斜线。 */
function padGaps(samples, intervalSec) {
  const stepMs = Math.max(1, intervalSec) * 1000; // 防 ≤0 时循环永不前进、页面卡死
  const pad = (n) => String(n).padStart(2, "0");
  const fmt = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}` +
    `T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  const out = [];
  for (let i = 0; i < samples.length; i++) {
    out.push(samples[i]);
    if (i === samples.length - 1) break;
    const t0 = new Date(samples[i].ts).getTime();
    const t1 = new Date(samples[i + 1].ts).getTime();
    if (t1 - t0 > stepMs * 2) {
      for (let t = t0 + stepMs; t + stepMs <= t1; t += stepMs) {
        out.push({ ts: fmt(new Date(t)), online: null, chatting: null, active: null, away: null, real: null, heat: null });
      }
    }
  }
  return out;
}

function initChart() {
  const dom = document.getElementById("chart");
  if (chart) { chart.dispose(); chart = null; }
  chart = echarts.init(dom, null, { renderer: "canvas" });
  /* 图例点击 → 记下隐藏项(重绘、刷新页面都按它恢复),并重绘一次让轴跟着线条显隐更新
   * (echarts 的图例点击只切线条本身,不会重建 option;热度线关掉时右轴要一并收起) */
  chart.on("legendselectchanged", (p) => {
    hiddenKeys.clear();
    for (const s of SERIES) if (p.selected[s.label] === false) hiddenKeys.add(s.key);
    saveHiddenKeys();
    renderChart(lastSamples, true, lastWindow);
  });
}

/* 固定时间窗口:预设范围用 {sec}(上界始终是"现在",跟着刷新滑动);
 * 自定义范围用后端的生效区间 {minMs, maxMs}(临时从库里取出来的「实际生效窗口」)。
 * maxMs 为 null = 上界跟着"现在"走 —— 预设范围、以及结束日含今天的自定义范围都是这种。
 * win 为 null 时横轴自适应(「全部」)。 */
function renderChart(samples, force, win) {
  lastSamples = samples;
  const lastTs = samples.length ? samples[samples.length - 1].ts : null;
  // 无新数据时跳过重绘(轮询比采样频繁,5/6 的轮询是空跑)
  if (!force && lastTs !== null && lastTs === lastRenderedTs) return;
  if (!chart) initChart();
  const dom = document.getElementById("chart");
  const empty = document.getElementById("empty");
  empty.style.display = samples.length ? "none" : "flex";
  if (!samples.length) {
    // 空图有两种成因,别让人一律以为"采集器挂了"
    const text = dataStartInFuture()
      ? "数据起点晚于当前时间 —— 库内暂无可用样本(把配置里的 data_start 改小后重启)"
      : "暂无数据 —— 等待采集器连上 iirose 并完成首次采样";
    if (empty.textContent !== text) empty.textContent = text;
  }
  dom.style.display = samples.length ? "block" : "none";
  if (samples.length) {
    const option = { ...baseOption(), animation: lastRenderedTs === null, series: seriesOption(samples) };
    lastWindow = win;
    if (win) {
      // 固定时间窗口:横轴始终显示完整区间,缺失时段显示为空缺,不压缩到有数据的部分。
      // 窗口起点由后端给(已顶过数据起点),预设范围才在前端按"现在"重算。
      option.xAxis = {
        ...option.xAxis,
        min: new Date(win.sec ? Date.now() - win.sec * 1000 : win.minMs),
        max: new Date(win.maxMs || Date.now()),
      };
    }
    // 动画只播首次(此后每秒刷新都瞬时重绘,避免长列表反复播动画造成卡顿)
    chart.setOption(option, true);
    lastRenderedTs = lastTs;
  }
}

/* ===== 数据 ===== */
/* 当前查询参数:自定义范围用 start/end 两个日期,其余走 range 预设 */
function seriesQuery() {
  if (currentRange === "custom" && customRange) {
    return `start=${customRange.start}&end=${customRange.end}`;
  }
  return `range=${currentRange}`;
}

/* 本次查询用什么窗口画横轴:自定义范围用后端给的生效区间(会被数据起点顶住),
 * 预设范围用固定时长。返回 null 表示横轴自适应(「全部」)。 */
function windowFor(body) {
  if (currentRange === "custom" && body.start) {
    const minMs = new Date(body.start).getTime();
    if (!Number.isFinite(minMs)) return null;
    const endMs = body.end ? new Date(body.end).getTime() : NaN;
    return { minMs: minMs, maxMs: Number.isFinite(endMs) ? endMs : null };
  }
  const sec = RANGE_SECONDS[currentRange];
  return sec ? { sec: sec, maxMs: null } : null;
}

function pad2(n) { return String(n).padStart(2, "0"); }
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
}
function shiftDays(dateStr, days) {
  const d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate() + days);
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
}

/* 数据起点(后端配置):日期输入的下限 + 页面上一句提示。
 * 早于起点的样本既不进图表也不进瓦片,但仍在服务器的库里;改配置重启即可换。 */
let dataStartIso = null;
function updateDataStart(value) {
  const next = value || null;
  if (next === dataStartIso) return;
  dataStartIso = next;
  const day = next ? next.slice(0, 10) : "";
  // 起点晚于当前时间时,库里一条可用样本都没有 —— 这种配置直说,否则看着像程序坏了。
  // (比的是完整时间戳而不只是日期:起点写成"今天 23:00"同样会让所有视图变空。)
  const future = dataStartInFuture();
  document.getElementById("dataStartHint").textContent = !day
    ? ""
    : future
      ? `数据起点 ${day} 00:00 晚于当前时间 —— 库内暂无可用样本(把 data_start 改小后重启采集器)`
      : `数据起点 ${day} 00:00 —— 更早的样本不计入图表与瓦片,仍保留在服务器库中`;
  for (const id of ["dateStart", "dateEnd"]) {
    const el = document.getElementById(id);
    // 起点在未来时不设下限:否则 min 晚于 max,日期框直接选不出东西
    if (day && !future) el.min = day; else el.removeAttribute("min");
    el.max = todayStr();
  }
}

/* 数据起点是否晚于当前时间(前端据此解释"图为什么是空的") */
function dataStartInFuture() {
  const ms = dataStartIso ? new Date(dataStartIso).getTime() : NaN;
  return Number.isFinite(ms) && ms > Date.now();
}

/* 请求序号:轮询与"点按钮"并发时,老请求晚回来不许覆盖新状态(实测会画成旧范围) */
let fetchSeq = 0;

async function refresh(force) {
  const seq = ++fetchSeq;
  try {
    const [seriesResp, latestResp] = await Promise.all([
      fetch(`/api/series?${seriesQuery()}`),
      fetch("/api/latest"),
    ]);
    const body = await seriesResp.json().catch(() => ({}));
    if (seq !== fetchSeq) return;  // 已有更新的请求发出:这次结果作废
    if (!seriesResp.ok) {  // 日期参数非法等:后端给出原因,退回上一次的图不动
      document.getElementById("updatedAt").textContent = body.error || "查询失败";
      return;
    }
    const samples = body.samples || [];
    const interval_seconds = body.interval_seconds;
    updateDataStart(body.data_start);
    const lastTs = samples.length ? samples[samples.length - 1].ts : null;
    const seriesUnchanged = !force && lastTs !== null && lastTs === lastDataTs;
    if (!seriesUnchanged) {
      lastDataTs = lastTs;
      const intervalSec = Number.isFinite(interval_seconds) && interval_seconds > 0 ? interval_seconds : 60;
      document.querySelector(".sub").textContent =
        `全站数据 · 每 ${Math.round(intervalSec)} 秒采样 · 点图例可隐藏/显示线条`;
      renderChart(padGaps(samples, intervalSec), force, windowFor(body));

      const tbody = document.getElementById("tbody");
      const rows = samples.slice(-100).reverse();
      // 用 DOM API + textContent 构建,数据即使将来混入字符串也不会被当 HTML 解析(XSS 防护)
      tbody.replaceChildren(...rows.map((r) => {
        const tr = document.createElement("tr");
        const tdTime = document.createElement("td");
        tdTime.textContent = r.ts.replace("T", " ").slice(5, 19);
        tr.appendChild(tdTime);
        for (const s of SERIES) {
          const td = document.createElement("td");
          td.textContent = r[s.key];
          tr.appendChild(td);
        }
        return tr;
      }));
    }

    // 瓦片与"最后采样"跟的是 /api/latest(与所选范围无关),必须每轮都更新 ——
    // 过去区间下 series 末条样本恒定不变,跟着上面一起早退会把它们永久冻结
    const { sample } = await latestResp.json();
    if (seq !== fetchSeq) return;
    if (sample) {
      for (const s of SERIES) document.getElementById("v-" + s.key).textContent = sample[s.key];
      document.getElementById("updatedAt").textContent = "最后采样 " + sample.ts.replace("T", " ").slice(5, 19);
    }
  } catch (e) {
    if (seq === fetchSeq) document.getElementById("updatedAt").textContent = "刷新失败,稍后重试";
  }
}

/* 容器尺寸变化(悬浮窗面板拖拽、窗口缩放)时同步图表画布 */
if (window.ResizeObserver) {
  new ResizeObserver(() => { if (chart) chart.resize(); })
    .observe(document.getElementById("chart"));
}

/* ===== 时间范围切换 ===== */
const dateStart = document.getElementById("dateStart");
const dateEnd = document.getElementById("dateEnd");
const customRow = document.getElementById("customRow");
const customMsg = document.getElementById("customMsg");

document.getElementById("rangeGrp").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-range]");
  if (!btn) return;
  currentRange = btn.dataset.range;
  document.querySelectorAll("#rangeGrp button").forEach((b) => b.classList.toggle("active", b === btn));
  customRow.hidden = currentRange !== "custom";
  if (currentRange === "custom" && !customRange) {
    // 首次切到自定义:预填 [数据起点(未设则近 7 天), 今天] 并直接查一次,再改日期点「应用」
    const end = todayStr();
    const start = dataStartIso ? dataStartIso.slice(0, 10) : shiftDays(end, -6);
    dateStart.value = start;
    dateEnd.value = end;
    customRange = { start: start, end: end };
  }
  customMsg.textContent = "";
  refresh(true);
});

/* 应用:两个日期都填、开始不晚于结束才发查询(结束日含当天整天,由后端顶到次日 0 点) */
document.getElementById("applyCustom").addEventListener("click", () => {
  const start = dateStart.value, end = dateEnd.value;
  if (!start || !end) { customMsg.textContent = "请选开始与结束日期"; return; }
  if (start > end) { customMsg.textContent = "开始日期不能晚于结束日期"; return; }
  customMsg.textContent = "";
  // 防呆:即使当前不在自定义模式(比如以后加了快捷键/程序化触发),点了应用就切过去
  currentRange = "custom";
  document.querySelectorAll("#rangeGrp button").forEach(
    (b) => b.classList.toggle("active", b.dataset.range === "custom"));
  customRow.hidden = false;
  customRange = { start: start, end: end };
  refresh(true);
});

refresh(true);
setInterval(refresh, 10000);
</script>
</body>
</html>
